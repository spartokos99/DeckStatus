<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ProLink setup · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/connection.css"><link rel="stylesheet" href="/navigation.css"></head>
<body><div class="shell"><header></header><main class="connection-main"><div class="intro"><span class="eyebrow" data-i18n="navSources"></span><h1 data-i18n="prolinkHeading"></h1><p data-i18n="prolinkIntro"></p></div>
<p id="mode-unavailable" class="connection-notice" hidden data-i18n="prolinkModeRequired"></p>
<section id="prolink-content" hidden>
<div class="connection-panel"><div class="connection-toolbar"><div><h2 data-i18n="prolinkNetwork"></h2><p id="prolink-status" role="status"></p></div><div class="connection-actions"><button id="discover" data-i18n="prolinkDiscover"></button><button id="connect" data-i18n="prolinkConnect" disabled></button><button id="disconnect" data-i18n="prolinkDisconnect" disabled></button></div></div><p id="connection-error" role="alert" hidden></p><dl id="network-details" class="connection-details"></dl><p class="hint" data-i18n="prolinkNetworkHelp"></p></div>
<div class="connection-section"><h2 data-i18n="prolinkDevices"></h2><p data-i18n="prolinkSelectHelp"></p><div id="devices" class="device-grid"></div><p id="no-devices" class="connection-empty" data-i18n="prolinkNoDevices"></p></div>
<div class="connection-info-grid"><div class="connection-panel"><h2 data-i18n="prolinkAvailable"></h2><p data-i18n="prolinkAvailableHelp"></p><p class="hint" data-i18n="prolinkMetadataHelp"></p></div><div class="connection-panel"><h2 data-i18n="prolinkLimits"></h2><p data-i18n="prolinkLimitsHelp"></p><p class="hint" data-i18n="prolinkOnAirHelp"></p></div></div>
</section></main></div><script type="module" src="/prolink-settings.js"></script></body></html>
