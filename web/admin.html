<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/portal.css"></head><body><div class="shell"><header></header><main><div class="intro"><span class="eyebrow" data-i18n="navAdmin"></span><h1 data-i18n="adminHeading"></h1><p data-i18n="adminIntro"></p></div><div class="portal-tabs" role="tablist"><button role="tab" data-tab="ratings" aria-selected="true" data-i18n="adminRatings"></button><button role="tab" data-tab="users" aria-selected="false" data-i18n="adminUsers"></button><button role="tab" data-tab="links" aria-selected="false" data-i18n="adminLinks"></button></div><p id="admin-message" class="portal-message" role="status"></p>
<section data-pane="ratings" class="panel"><div class="portal-actions"><input id="rating-search" class="portal-search" type="search" data-i18n-aria="adminSearch"><select id="rating-sort" data-i18n-aria="adminSort"><option value="average" data-i18n="adminByRating"></option><option value="count" data-i18n="adminByVotes"></option><option value="title" data-i18n="title"></option></select><button id="rating-refresh" data-i18n="adminRefresh"></button></div><p class="portal-muted" data-i18n="adminRatingHelp"></p><div class="portal-table-wrap"><table class="portal-table"><thead><tr><th data-i18n="historyTrack"></th><th data-i18n="album"></th><th data-i18n="adminAverage"></th><th data-i18n="adminVotes"></th></tr></thead><tbody id="rating-rows"></tbody></table></div><p id="ratings-empty" data-i18n="adminNoRatings"></p></section>
<section data-pane="users" hidden class="portal-columns"><div class="panel"><h2 data-i18n="adminUsers"></h2><button id="user-new" data-i18n="adminNewUser"></button><div id="users-list" class="portal-list"></div></div><div class="panel"><h2 id="user-heading" data-i18n="adminNewUser"></h2><form id="user-form" class="portal-form"><label for="user-name" data-i18n="authUsername"></label><input id="user-name" required minlength="3" maxlength="40" autocomplete="off" pattern="[a-zA-Z0-9._-]+"><label for="user-role" data-i18n="authRole"></label><select id="user-role"><option value="operator" data-i18n="authOperator"></option><option value="admin" data-i18n="authAdministrator"></option></select><label for="user-password" data-i18n="authNewPassword"></label><input id="user-password" type="password" minlength="12" maxlength="256" autocomplete="new-password"><p class="portal-muted" data-i18n="adminPasswordHelp"></p><div class="portal-actions"><button type="submit" data-i18n="portalSave"></button><button type="button" id="user-delete" hidden data-i18n="portalDelete"></button></div></form></div></section>
<section data-pane="links" hidden class="panel"><h2 data-i18n="adminLinks"></h2><p class="portal-muted" data-i18n="adminLinksHelp"></p><button id="rotate-overlays" data-i18n="adminRotate"></button></section></main></div><script type="module" src="/navigation.js"></script><script type="module" src="/admin.js"></script></body></html>
