<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Password · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/portal.css"></head><body><main class="auth-shell"><a class="auth-brand" href="/"><img src="/icon.svg" alt="">DeckStatus</a><select data-language aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select><section class="panel"><h1 data-i18n="authChangePassword"></h1><p data-i18n="authChangeHelp" class="portal-muted"></p><form id="password-form" class="portal-form"><label for="current-password" data-i18n="authCurrentPassword"></label><input id="current-password" type="password" autocomplete="current-password" required maxlength="256"><label for="new-password" data-i18n="authNewPassword"></label><input id="new-password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"><label for="confirm-password" data-i18n="authConfirmPassword"></label><input id="confirm-password" type="password" autocomplete="new-password" required minlength="12" maxlength="256"><button type="submit" data-i18n="authChangePassword"></button></form><p id="auth-message" class="portal-message" role="status"></p><button id="auth-logout" data-i18n="authSignOut"></button></section></main><script type="module" src="/auth.js"></script></body></html>
