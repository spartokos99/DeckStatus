<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/portal.css"></head><body><main class="auth-shell"><a class="auth-brand" href="/history"><img src="/icon.svg" alt="">DeckStatus</a><select data-language aria-label="Language"><option value="en">English</option><option value="de">Deutsch</option></select><section class="panel"><h1 data-i18n="authSignIn"></h1><p class="portal-muted" data-i18n="authInitialHelp"></p><form id="login-form" class="portal-form"><label for="username" data-i18n="authUsername"></label><input id="username" autocomplete="username" required maxlength="40" autofocus><label for="password" data-i18n="authPassword"></label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit" data-i18n="authSignIn"></button></form><p id="auth-message" class="portal-message" role="status"></p><a href="/history" data-i18n="authPublicHistory"></a></section></main><script type="module" src="/auth.js"></script></body></html>
