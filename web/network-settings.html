<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/settings.css"><link rel="stylesheet" href="/connection.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/network-settings.css"></head>
<body><div class="shell"><header></header><main class="connection-main">
<div class="intro"><span class="eyebrow" data-i18n="navSources"></span><h1 data-i18n="networkHeading"></h1><p data-i18n="networkIntro"></p></div>
<p id="network-error" class="connection-notice" role="alert" hidden></p>
<p id="network-local-only" class="connection-notice" data-i18n="networkLocalOnly" hidden></p>
<div class="network-grid"><section class="connection-panel"><h2 data-i18n="networkConfigure"></h2>
<fieldset id="network-fields" disabled>
<div class="setting"><label for="network-access" data-i18n="networkAccess"></label><select id="network-access"><option value="local" data-i18n="networkLocal"></option><option value="lan" data-i18n="networkLan"></option><option value="interface" data-i18n="networkInterface"></option></select></div>
<div class="setting" id="network-interface-row" hidden><label for="network-interface" data-i18n="networkAdapter"></label><select id="network-interface"></select></div>
<div class="setting"><label for="network-port" data-i18n="networkPort"></label><input id="network-port" type="number" min="1" max="65535" step="1" required></div>
<label class="network-check"><input id="network-control" type="checkbox"><span data-i18n="networkRemoteControl"></span></label><p class="hint" data-i18n="networkRemoteControlHelp"></p>
<button id="network-save" type="button" data-i18n="networkSave"></button>
</fieldset><p id="network-feedback" role="status"></p><p class="hint" data-i18n="networkSaveHelp"></p>
</section><section class="connection-panel"><h2 data-i18n="networkCurrent"></h2><p id="network-active" role="status"></p><dl id="network-details" class="connection-details"></dl>
<p id="network-restart" class="connection-notice" hidden data-i18n="networkRestart"></p><p id="network-overrides" class="hint" hidden data-i18n="networkOverrides"></p>
<h2 class="network-address-title" data-i18n="networkAddresses"></h2><p class="hint" data-i18n="networkAddressHelp"></p><div id="network-urls"></div><p id="network-no-lan" class="hint" hidden data-i18n="networkNoLan"></p>
</section></div><section class="connection-panel network-connect-help"><h2 data-i18n="networkConnectHeading"></h2><p data-i18n="networkConnectHelp"></p><p class="hint" data-i18n="networkScopeHelp"></p></section>
</main></div><script type="module" src="/network-settings.js"></script></body></html>
