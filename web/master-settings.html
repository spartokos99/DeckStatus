<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="/icon.svg"><title>DeckStatus overlay settings</title><link rel="stylesheet" href="/settings.css"></head>
<body><div class="shell">
<header><a class="brand" href="/"><img src="/icon.svg" width="38" height="38" alt=""><strong>DeckStatus</strong></a><nav><a href="/" data-i18n="dashboard"></a><a href="/overlay/settings" data-i18n="deckSettings"></a><a href="/master-overlay/settings" data-i18n="masterSettings"></a><a href="/waveform/settings" data-i18n="waveNav"></a><a href="/history" data-i18n="fullHistory"></a><select id="language" data-language data-i18n-aria="language"><option value="en">English</option><option value="de">Deutsch</option></select></nav></header>
<div class="intro"><span class="eyebrow" data-i18n="stream"></span><h1 id="heading"></h1><p id="intro"></p></div>
<main class="layout"><section class="panel"><h2 data-i18n="yourOverlay"></h2>
<div class="setting" data-mode="deck"><label for="deck" data-i18n="chooseDeck"></label><select id="deck"><option value="1">Deck 1</option><option value="2">Deck 2</option><option value="3">Deck 3</option><option value="4">Deck 4</option></select></div>
<div class="setting" data-mode="master"><label for="history"><span data-i18n="previousTracks"></span> <output id="history-value"></output></label><input data-option id="history" type="number" min="0" max="50" step="1"><small data-i18n="historyHelp"></small></div>
<div class="setting" data-mode="master"><label for="historyScale"><span data-i18n="historySize"></span> <output id="scale-value"></output></label><input data-option id="historyScale" type="range" min="0.2" max="1" step="0.01"><small data-i18n="scaleHelp"></small></div>
<div class="setting" ><label for="align"><span data-i18n="alignment"></span> <output id="align-value"></output></label><select data-option id="align"><option value="left" data-i18n="left"></option><option value="center" data-i18n="center"></option><option value="right" data-i18n="right"></option></select><small data-i18n="alignHelp"></small></div>
<fieldset><legend data-i18n="showFields"></legend><div class="fields"><label><input type="checkbox" name="field" value="title"><span data-i18n="title"></span></label><label><input type="checkbox" name="field" value="artist"><span data-i18n="artist"></span></label><label><input type="checkbox" name="field" value="album"><span data-i18n="album"></span></label><label><input type="checkbox" name="field" value="key"><span data-i18n="key"></span></label><label><input type="checkbox" name="field" value="bpm"><span data-i18n="bpm"></span></label><label><input type="checkbox" name="field" value="cover"><span data-i18n="cover"></span></label></div><p class="hint" data-i18n="bpmHelp"></p></fieldset>
<div class="setting"><label><input data-option id="timeline" type="checkbox"> <span data-i18n="timeline"></span></label><small data-i18n="timelineHelp"></small></div>
<div class="setting" ><label for="duration"><span data-i18n="duration"></span> <output id="duration-value"></output></label><input data-option id="duration" type="range" min="0" max="2000" step="50"><small data-i18n="durationHelp"></small></div>
<div class="setting" ><label for="width"><span data-i18n="width"></span> <output id="width-value"></output></label><input data-option id="width" type="number" min="320" max="1600" step="10"></div>
<h2 data-i18n="appearance"></h2>
<div class="setting" ><label for="preset"><span data-i18n="preset"></span> <output id="preset-value"></output></label><select id="preset"><option value="custom" data-i18n="custom"></option><option value="midnight" data-i18n="midnight"></option><option value="light" data-i18n="light"></option><option value="minimal" data-i18n="minimal"></option></select><small data-i18n="presetHelp"></small></div>
<div class="design-grid">
<div class="setting" ><label for="background"><span data-i18n="background"></span> <output id="background-value"></output></label><input data-option id="background" type="color"></div><div class="setting" ><label for="textColor"><span data-i18n="textColor"></span> <output id="textColor-value"></output></label><input data-option id="textColor" type="color"></div><div class="setting" ><label for="mutedColor"><span data-i18n="mutedColor"></span> <output id="mutedColor-value"></output></label><input data-option id="mutedColor" type="color"></div><div class="setting" ><label for="accent"><span data-i18n="accent"></span> <output id="accent-value"></output></label><input data-option id="accent" type="color"></div>
<div class="setting" ><label for="opacity"><span data-i18n="opacity"></span> <output id="opacity-value"></output></label><input data-option id="opacity" type="range" min="0" max="100" step="1"></div>
<div class="setting" ><label for="font"><span data-i18n="font"></span> <output id="font-value"></output></label><select data-option id="font"><option value="system" data-i18n="system"></option><option value="serif" data-i18n="serif"></option><option value="mono" data-i18n="mono"></option></select></div>
<div class="setting" ><label for="fontSize"><span data-i18n="fontSize"></span> <output id="fontSize-value"></output></label><input data-option id="fontSize" type="number" min="14" max="40" step="1"></div><div class="setting" ><label for="coverSize"><span data-i18n="coverSize"></span> <output id="coverSize-value"></output></label><input data-option id="coverSize" type="number" min="32" max="180" step="1"></div><div class="setting" ><label for="padding"><span data-i18n="padding"></span> <output id="padding-value"></output></label><input data-option id="padding" type="number" min="4" max="48" step="1"></div><div class="setting" ><label for="gap"><span data-i18n="gap"></span> <output id="gap-value"></output></label><input data-option id="gap" type="number" min="0" max="40" step="1"></div><div class="setting" ><label for="radius"><span data-i18n="radius"></span> <output id="radius-value"></output></label><input data-option id="radius" type="number" min="0" max="40" step="1"></div><div class="setting" ><label for="border"><span data-i18n="border"></span> <output id="border-value"></output></label><input data-option id="border" type="number" min="0" max="10" step="1"></div>
</div><div class="setting" ><label for="layout"><span data-i18n="layout"></span> <output id="layout-value"></output></label><select data-option id="layout"><option value="horizontal" data-i18n="horizontal"></option><option value="stacked" data-i18n="stacked"></option></select></div>
<div class="setting"><label><input data-option id="shadow" type="checkbox"> <span data-i18n="shadow"></span></label></div><div class="setting"><label><input data-option id="badges" type="checkbox"> <span data-i18n="badges"></span></label></div>
<button id="reset" type="button" data-i18n="reset"></button>
<div class="setting" data-mode="deck" style="margin-top:20px"><button id="all-decks" type="button" data-i18n="allDecks"></button><small data-i18n="allDecksHelp"></small></div>
</section><section class="preview-column">
<div class="preview-heading"><h2 data-i18n="preview"></h2><span class="status" id="status" role="status"></span></div>
<div class="canvas"><iframe id="preview" data-i18n-title="preview"></iframe></div><p class="hint" data-i18n="previewHint"></p>
<div class="url-panel"><h2 data-i18n="useObs"></h2><p data-i18n="obsHelp"></p>
<div class="url"><input id="url" readonly aria-label="OBS URL"><button id="copy" type="button" data-i18n="copyUrl"></button></div>
<div class="links"><a id="open" target="_blank" rel="noopener" data-i18n="openOverlay"></a><span id="dimensions"></span></div>
<div id="deck-links" class="deck-links" data-mode="deck"></div><p id="feedback" role="status"></p>
</div></section></main></div><script type="module" src="/settings.js"></script></body></html>
