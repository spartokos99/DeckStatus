<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Full History · DeckStatus</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/history.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/portal.css"></head>
<body><div class="shell">
<header></header>
<main><div class="intro"><span class="eyebrow" data-i18n="historyEyebrow"></span><h1 data-i18n="historyHeading"></h1><p data-i18n="historyIntro"></p></div>
<div class="history-toolbar"><div><strong id="count"></strong><span id="status" role="status"></span></div><button id="refresh" data-i18n="historyLatest"></button></div>
<p id="demo-notice" class="history-notice" hidden data-i18n="demoNotice"></p>
<p id="rating-feedback" class="portal-message" role="status"></p>
<section class="viewer-login"><p id="viewer-status" role="status"></p><p data-i18n="viewerPrivacy"></p><div class="portal-actions"><button id="viewer-login" disabled data-i18n="viewerLogin"></button><button id="viewer-logout" hidden data-i18n="viewerLogout"></button><a id="history-ratings-link" href="/admin#ratings" hidden data-i18n="viewerManageRatings"></a></div><div id="viewer-pending" hidden><code id="viewer-code"></code> <a id="viewer-activate" target="_blank" rel="noopener noreferrer" data-i18n="viewerActivate"></a><p data-i18n="viewerCodeHelp"></p></div><p id="viewer-error" role="status"></p></section>
<div class="table-surface"><table><caption class="sr-only" data-i18n="fullHistory"></caption><thead><tr><th scope="col">#</th><th scope="col" data-i18n="historyObserved"></th><th scope="col" data-i18n="historyTrack"></th><th scope="col" data-i18n="album"></th><th scope="col" data-i18n="historyDeck"></th><th scope="col" data-i18n="key"></th><th scope="col" data-i18n="historyTempo"></th><th scope="col" data-i18n="historyState"></th></tr></thead><tbody id="history-rows"></tbody></table><p id="empty" data-i18n="historyEmpty"></p></div>
<div class="pagination"><button id="newer" disabled data-i18n="historyNewer"></button><span id="page" role="status"></span><button id="older" disabled data-i18n="historyOlder"></button></div>
<p class="hint" data-i18n="historySessionHelp"></p>
<p class="hint" data-i18n="ratingHelp"></p>
</main></div><script type="module" src="/history.js"></script><script type="module" src="/navigation.js"></script></body></html>
